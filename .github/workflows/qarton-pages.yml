name: Deploy QARTON Test Lab
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'official-intro.mp4'
      - 'scripts/check-pages.py'
      - '.github/workflows/qarton-pages.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qarton-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Test Lab site
        run: |
          mkdir _site
          cp -R index.html docs examples src official-intro.mp4 _site/
          cd _site
          test -s index.html
          test -s docs/index.html
          test -s examples/browser-smoke.html
          test -s src/index.js
          test -s official-intro.mp4
          grep -q 'QARTON' docs/index.html
      - name: Exercise the staged site in desktop and mobile Chrome
        run: |
          python -m venv "$RUNNER_TEMP/qarton-browser"
          "$RUNNER_TEMP/qarton-browser/bin/pip" install playwright==1.55.0
          "$RUNNER_TEMP/qarton-browser/bin/python" scripts/check-pages.py
      - name: Upload static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
