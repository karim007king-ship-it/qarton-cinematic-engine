name: Motion Studio V2 L14-A prototype
on:
  pull_request:
    branches: [feature/motion-studio-easy-mobile-l13l1]
    paths:
      - '.github/workflows/motion-studio-v2-prototype.yml'
      - 'examples/motion-studio-v2/**'
  push:
    branches: [feature/motion-studio-v2-l14a]
    paths:
      - '.github/workflows/motion-studio-v2-prototype.yml'
      - 'examples/motion-studio-v2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    env:
      L14_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build and test standalone HTML offline
        working-directory: examples/motion-studio-v2
        run: python check-prototype.py
      - name: Package Android standalone preview
        run: |
          cd examples/motion-studio-v2
          zip -r motion-studio-v2-l14a-android-preview.zip dist/qarton-motion-studio-v2.html README.md
      - uses: actions/upload-artifact@v4
        with:
          name: motion-studio-v2-l14a-android-preview
          path: examples/motion-studio-v2/motion-studio-v2-l14a-android-preview.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: motion-studio-v2-l14a-section-screenshots
          path: examples/motion-studio-v2/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
