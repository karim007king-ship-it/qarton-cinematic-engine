name: Independent audio diagnostics
on:
  pull_request:
    paths:
      - 'examples/audio-diagnostics/**'
      - 'scripts/check-audio-diagnostics.py'
      - '.github/workflows/audio-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chrome
      - run: python scripts/check-audio-diagnostics.py
