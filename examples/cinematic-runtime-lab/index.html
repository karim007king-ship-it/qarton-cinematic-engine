<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0d"><title>QARTON — Cinematic Runtime Lab</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><strong>QARTON <span>CINEMATIC RUNTIME</span></strong><small id="commit">Commit: local preview</small></header><section class="stage"><canvas id="screen" width="720" height="1280" aria-label="المشهد السينمائي"></canvas><div class="title" id="scene-title"></div><div class="dialogue"><b id="speaker"></b><p id="line" dir="auto"></p><button id="show-all">إظهار النص كاملًا</button><div id="choice" hidden></div></div><div class="ending" id="ending" hidden></div></section><nav class="controls"><button id="play">تشغيل</button><button id="pause">إيقاف مؤقت</button><button id="resume">متابعة</button><button id="skip">تجاوز الحوار</button><button id="advance">التالي</button><button id="replay">إعادة</button></nav><section class="timeline"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="توقيت المشهد"><span id="time">00:00</span></section><section class="save"><button id="save">حفظ التقدم</button><button id="restore">استرجاع</button><span id="status">جاهز — تشغيل محلي بلا صوت بشري</span></section><details><summary>سجل أحداث المحركات التجريبية</summary><pre id="log"></pre></details><footer>تشغيل قصصي مستقل • لا AudioContext ولا ميكروفون • assets محلية</footer></main><script type="module" src="runtime-lab.js"></script></body></html>
