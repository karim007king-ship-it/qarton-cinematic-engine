<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>QARTON — Layered Character Visual Test</title><link rel="stylesheet" href="style.css"><style>body{max-width:680px;margin:auto}.visual-test{padding:12px}.visual-test canvas{display:block;width:min(100%,360px);height:auto;margin:10px auto;background:#101116;border:1px solid #d5ae61;border-radius:12px}.poses{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.poses button{min-height:44px}#mouth-state{text-align:center;color:#d5ae61}</style></head>
<body><main class="app visual-test"><header><strong>QARTON <span>LAYERED SPRITE TEST</span></strong><a href="index.html">العودة للمختبر</a></header><p>أصول SVG شفافة محلية لاختبار تطابق الطبقات والارتكاز. اختر وضعية الفم لمقارنة الرسم الفعلي.</p><canvas id="test-stage" width="720" height="1280" aria-label="اختبار الشخصية متعددة الطبقات"></canvas><div class="poses"><button data-pose="closed">مغلق</button><button data-pose="open">مفتوح</button><button data-pose="round">دائري</button><button data-pose="wide">عريض</button><button data-pose="teeth">أسنان</button></div><p id="mouth-state">تحميل الأصول…</p><p id="commit"></p></main><script type="module" src="layered-character-viewer.js"></script></body></html>
